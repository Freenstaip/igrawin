<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление...</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .container {
            padding: 30px;
        }

        p {
            color: #aaa;
            margin-bottom: 25px;
        }

        .redirect-button {
            display: inline-block;
            padding: 14px 28px;
            background: #fff;
            color: #111;
            text-decoration: none;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h1>Перенаправляем вас...</h1>

    <p>
        Если переход не произошёл автоматически,
        нажмите кнопку ниже.
    </p>

    <a id="redirectButton" class="redirect-button" href="#">
        Перейти на сайт
    </a>
</div>

<script>
    // МЕНЯЕШЬ ССЫЛКУ ТОЛЬКО ЗДЕСЬ
    const redirectUrl = "https://example.com";

    // Ссылка для кнопки
    document.getElementById("redirectButton").href = redirectUrl;

    // Мгновенный редирект
    window.location.replace(redirectUrl);
</script>

</body>
</html>
